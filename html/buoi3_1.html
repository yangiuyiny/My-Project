<!DOCTYPE html>
<html lang="vi">
	<head>
		<title>Đăng ký</title>
		<meta charset="utf-8">
		<link href="../css/style3.css" rel="stylesheet">
	</head>
	<body>
		<div id="container">
			<form>
				<h2 id="title">Đăng ký</h2>
				<div class="frm">
					<label for="txtUsername">Họ tên:</label>
					<input type="text" placeholder="Nguyễn Văn A" id="txtUsername" name="txtUsername">
				</div>
				<div class="frm">
					<label for="txtEmail">Email:</label>
					<input type="text" placeholder="example@gmail.com" id="txtEmail" name="txtEmail">
				</div>
				<div class="frm">
					<label for="txtStd">Số điện thoại:</label>
					<input type="text" placeholder="0368 234 456" id="txtStd" name="txtStd">
				</div>
				<div class="frm">
					<label for="txtPassword">Mật khẩu:</label>
					<input type="password" placeholder="Mật khẩu" id="txtPassword" name="txtPassword">					
				</div>
				<div id="login">
				<input type="submit" id="sbLogin" name="sbLogin">
				<input type="reset" id="rsCancel" name="rsCancel">
				</div>
				<button><a href="page3.html" id="nut">Đăng Nhập</a></button>
			</form>
			
		</div>
	<body>
</html>
